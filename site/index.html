<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home energy usage</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Energy">
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1d1a2e;--mut:#6b6880;--bd:#e2e0ee;--el:#3b82f6;--gs:#f97316;--up:#d9480f;--dn:#2b9348}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1e1b2e;--tx:#efedf8;--mut:#9c98b3;--bd:#34304a;--up:#ff8a5c;--dn:#4cc275}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.verdict{font-size:15px;margin:2px 0 10px}
.chart{position:relative;height:280px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
#install{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:0;background:#f59e0b;color:#1d1a2e;cursor:pointer}
.est{font-style:italic;color:var(--mut)}
label.toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tx);margin:0 0 10px;cursor:pointer}
label.toggle input{width:16px;height:16px;margin:0;accent-color:#f59e0b}
#notes{margin:0;padding-left:18px}#notes li{margin:4px 0}
.tall{max-height:460px;overflow:auto}
.tall thead th{position:sticky;top:0;background:var(--card)}
</style></head><body><main>
<header><h1>⚡ Home energy usage</h1><button id="install" hidden>Install app</button></header>
<p class="mut" id="msg">Loading…</p>

<div id="app" hidden>
 <section class="card">
  <h2 id="dtitle">Usage by month</h2>
  <div class="row">
   <div><label>Fuel</label><select id="fuel"><option value="gas" selected>Gas</option><option value="electricity">Electricity</option></select></div>
   <div><label>View</label><select id="view"><option value="month" selected>Months</option><option value="week">Weeks</option></select></div>
   <div><label id="plabel">Month</label><select id="month"></select></div>
   <div><label>Compare year</label><select id="ya"></select></div>
   <div><label>Against year</label><select id="yb"></select></div>
  </div>
  <div class="chart" style="margin-top:12px"><canvas id="cm"></canvas></div>
  <div class="scroll" id="tbl" style="margin-top:10px"></div>
 </section>

 <section class="card">
  <h2>Gas vs electricity, year on year</h2>
  <p class="mut" id="span"></p>
  <label class="toggle" id="esttoggle" hidden><input type="checkbox" id="useest" checked> Fill gaps in older years with estimates</label>
  <div class="chart"><canvas id="cs"></canvas></div>
 </section>
 <div class="grid" id="fuels"></div>

 <section class="card" id="about" style="margin-top:14px" hidden>
  <h2>About the data</h2>
  <ul class="mut" id="notes"></ul>
 </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COL=['#e5007d','#3b82f6','#f59e0b','#10b981','#8b5cf6','#ef4444','#14b8a6','#a16207','#64748b','#ec4899'];
const NAME={electricity:'Electricity',gas:'Gas'};
const GASF=11.2; // approx kWh per m³ for SMETS2 gas meters
let D,years=[],charts={},LY,LM,WI={},LWY,LWW;
const pick={month:'all',week:'all'}; // remembers the period choice for each view

fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;start()})
 .catch(e=>{$('msg').textContent=D?'Could not display the data: '+(e&&e.message||e):'No data yet. In GitHub: Actions → Update energy data and deploy site → Run workflow.'});

const key=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
let useEst=true;
try{useEst=localStorage.getItem('useEst')!=='0'}catch(e){}
const EST=f=>(D.estimates||{})[f]||{}, QUAL=f=>(D.quality||{})[f]||{};
const conv=(f,v)=>f==='gas'&&D.gas_unit==='m3'?v*GASF:v;
// a month is "estimated" when it had missing readings and estimates are switched on
function isEst(f,y,m){return useEst&&EST(f)[key(y,m)]!=null}
function val(f,y,m){
  const k=key(y,m),e=EST(f)[k];
  if(useEst&&e!=null)return conv(f,e);
  if(QUAL(f)[k]!=null)return null; // partial month: never shown as if it were complete
  const v=D[f][k];return v==null?null:conv(f,v);
}
function anyEst(f,y,m){for(let i=0;i<=m;i++)if(isEst(f,y,i))return true;return false}
const fmt=v=>v==null?'–':Math.round(v).toLocaleString();
const fmtE=(v,e)=>v==null?'–':e?`<span class="est" title="Includes estimated readings">~${fmt(v)}</span>`:fmt(v);
const pct=(a,b)=>(a==null||!b)?null:(a-b)/b*100;
function pctHtml(p,e){if(p==null)return '–';return `<span class="${p>0?'up':'dn'}"${e?' style="font-style:italic" title="Includes estimated months"':''}>${p>0?'+':''}${p.toFixed(1)}%</span>`}
const fade=c=>c+'59'; // lighter colour for estimated bars and points

// latest complete month: the newest month in the data, stepping back if it is still the current month
function lastComplete(){
  const ks=[...Object.keys(D.electricity),...Object.keys(D.gas)].sort(),k=ks[ks.length-1];
  const n=new Date(),cur=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  let y=+k.slice(0,4),m=+k.slice(5)-1;
  if(k>=cur){m--;if(m<0){y--;m=11}}
  return {y,m};
}
// total Jan..m for a year, only if every month in that span has data (avoids misleading part-years)
function span(f,y,m){let s=0;for(let i=0;i<=m;i++){const v=val(f,y,i);if(v==null)return null;s+=v}return s}
function full(f,y){return span(f,y,11)}

// ---- weekly data: Monday-start weeks keyed by date, shown by ISO week number ----
function isoWeek(mon){ // 'YYYY-MM-DD' (a Monday) -> {y, w}
  const d=new Date(mon+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+3); // that week's Thursday
  const y=d.getUTCFullYear();
  return {y,w:1+Math.floor((d-Date.UTC(y,0,1))/864e5/7)};
}
function mondayOf(y,w){ // date of the Monday of ISO week w in year y
  const j4=new Date(Date.UTC(y,0,4)),d=new Date(j4);
  d.setUTCDate(4-((j4.getUTCDay()+6)%7)+(w-1)*7);return d;
}
const wkLabel=(y,w)=>mondayOf(y,w).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
function buildWeeks(){
  let last='';
  for(const f of['electricity','gas']){
    WI[f]={};
    for(const [k,v] of Object.entries((D.weekly||{})[f]||{})){
      const {y,w}=isoWeek(k);(WI[f][y]=WI[f][y]||{})[w]=conv(f,v);if(k>last)last=k;
    }
  }
  if(!last)return;
  // latest complete week: step back if the newest week hasn't finished yet
  const lm=new Date(last+'T12:00:00Z');if(lm.getTime()+7*864e5>Date.now())lm.setUTCDate(lm.getUTCDate()-7);
  ({y:LWY,w:LWW}=isoWeek(lm.toISOString().slice(0,10)));
}
const wval=(f,y,w)=>(WI[f][y]||{})[w]??null;
const hasWeeks=()=>!!LWY;

function start(){
  const ys=new Set();for(const f of['electricity','gas'])for(const k of[...Object.keys(D[f]),...Object.keys(EST(f))])ys.add(+k.slice(0,4));
  years=[...ys].sort();
  if(!years.length){$('msg').textContent='No data yet. In GitHub: Actions → Update energy data and deploy site → Run workflow.';return}
  ({y:LY,m:LM}=lastComplete());
  $('msg').textContent=D.updated?'Last updated '+new Date(D.updated).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'';
  $('app').hidden=false;
  const hasEst=Object.keys(EST('electricity')).length+Object.keys(EST('gas')).length>0;
  $('esttoggle').hidden=!hasEst;
  $('useest').checked=useEst;
  $('useest').onchange=()=>{useEst=$('useest').checked;try{localStorage.setItem('useEst',useEst?'1':'0')}catch(e){}summary();detail()};
  if(D.notes&&D.notes.length){
    $('notes').innerHTML=[...D.notes,'~ marks a total that includes estimated months. Turn off “Fill gaps” to compare only years with complete readings.']
      .map(n=>`<li>${n.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'})[c])}</li>`).join('');
    $('about').hidden=false;
  }
  buildWeeks();
  if(!hasWeeks())$('view').disabled=true;
  summary();
  const yo=years.map(y=>`<option>${y}</option>`).join('');
  $('ya').innerHTML=yo;$('yb').innerHTML=yo;
  $('ya').value=LY;$('yb').value=years[Math.max(0,years.indexOf(LY)-1)];
  periods();
  $('view').onchange=()=>{periods();detail()};
  $('month').onchange=()=>{pick[$('view').value]=$('month').value;detail()};
  for(const id of['fuel','ya','yb'])$(id).onchange=detail;
  detail();
}

// period dropdown follows the view: months, or ISO weeks 1-53
function periods(){
  const wk=$('view').value==='week';
  $('plabel').textContent=wk?'Week':'Month';
  $('month').innerHTML=wk
    ?'<option value="all">All weeks</option>'+Array.from({length:53},(_,i)=>`<option value="${i+1}">Week ${i+1} (w/c ${wkLabel(LWY,i+1)})</option>`).join('')
    :'<option value="all">All months</option>'+MN.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  $('month').value=pick[$('view').value];
}

function draw(id,cfg){
  if(charts[id])charts[id].destroy();
  const tx=getComputedStyle(document.documentElement).getPropertyValue('--mut');
  cfg.options={responsive:true,maintainAspectRatio:false,color:tx,
    scales:{x:{ticks:{color:tx}},y:{ticks:{color:tx},title:{display:true,text:'kWh',color:tx}}},...cfg.options};
  charts[id]=new Chart($(id),cfg);
}

function summary(){
  const label=`Jan–${MN[LM]}`;
  $('span').textContent=`Like-for-like: every year is compared over ${label} only, so ${LY} isn’t penalised for being unfinished. `
    +(useEst?'Lighter bars and ~ totals include estimated months.':'Years missing any of those months are left out.');
  const rows={};
  for(const f of['electricity','gas'])rows[f]=years.map(y=>({y,s:span(f,y,LM),fy:full(f,y),es:anyEst(f,y,LM),fe:anyEst(f,y,11)}));
  const shown=years.filter(y=>rows.electricity.find(r=>r.y===y).s!=null||rows.gas.find(r=>r.y===y).s!=null);
  const ds=(f,name,c)=>{const r=y=>rows[f].find(x=>x.y===y);
    return {label:name,backgroundColor:shown.map(y=>r(y).es?fade(c):c),borderColor:c,borderWidth:shown.map(y=>r(y).es?1.5:0),data:shown.map(y=>r(y).s)}};
  draw('cs',{type:'bar',data:{labels:shown.map(String),datasets:[ds('electricity','Electricity','#3b82f6'),ds('gas','Gas','#f97316')]},
    options:{plugins:{legend:{labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>{const r=rows[c.dataset.label==='Gas'?'gas':'electricity'].find(x=>x.y===+c.label);
      return `${c.dataset.label}: ${r.es?'~':''}${fmt(c.raw)} kWh${r.es?' (incl. estimates)':''}`}}}}}});
  let html='';
  for(const f of['electricity','gas']){
    const rs=rows[f],withS=rs.filter(r=>r.s!=null);
    const cur=rs.find(r=>r.y===LY),prev=rs.find(r=>r.y===LY-1);
    let v='Not enough data yet for a like-for-like comparison.';
    if(cur&&cur.s!=null){
      const rank=[...withS].sort((a,b)=>b.s-a.s).findIndex(r=>r.y===LY)+1,n=withS.length;
      const p=prev&&prev.s!=null?pct(cur.s,prev.s):null;
      const avg=withS.filter(r=>r.y!==LY);
      const pa=avg.length?pct(cur.s,avg.reduce((a,r)=>a+r.s,0)/avg.length):null;
      v=`${LY} (${label}) is `+(p==null?'':`<b class="${p>0?'up':'dn'}">${Math.abs(p).toFixed(1)}% ${p>0?'higher':'lower'}</b> than ${LY-1}`)
        +(pa==null||avg.length<2?'. ':`${p==null?'':' and '}<b class="${pa>0?'up':'dn'}">${Math.abs(pa).toFixed(1)}% ${pa>0?'above':'below'}</b> the `
          +(avg[avg.length-1].y-avg[0].y===avg.length-1?`${avg[0].y}–${avg[avg.length-1].y}`:avg.map(r=>r.y).join('/'))+' average. ')
        +(n>1?(rank===1?`The highest of ${n} years.`:rank===n?`The lowest of ${n} years.`:`#${rank} highest of ${n} years.`):'');
    }
    let t=`<table><thead><tr><th>Year</th><th>${label}</th><th>vs prev</th><th>Full year</th></tr></thead><tbody>`;
    rs.forEach((r,i)=>{if(r.s==null&&r.fy==null)return;
      const p=i>0?pct(r.s,rs[i-1].s):null;
      t+=`<tr><td>${r.y}</td><td>${fmtE(r.s,r.es)}</td><td>${pctHtml(p,r.es||(i>0&&rs[i-1].es))}</td><td>${fmtE(r.fy,r.fe)}</td></tr>`});
    t+='</tbody></table>';
    html+=`<section class="card"><h2><span class="dot" style="background:var(--${f==='gas'?'gs':'el'})"></span>${NAME[f]}</h2><p class="verdict">${v}</p><div class="scroll">${t}</div></section>`;
  }
  $('fuels').innerHTML=html;
}

function detail(){
  if($('view').value==='week')return detailWeeks();
  $('dtitle').textContent='Usage by month';
  const f=$('fuel').value,mo=$('month').value,ya=+$('ya').value,yb=+$('yb').value;
  const ys=years.filter(y=>Array.from({length:12},(_,m)=>val(f,y,m)).some(v=>v!=null));
  if(mo==='all'){
    draw('cm',{type:'line',data:{labels:MN,datasets:ys.map((y,i)=>{const c=COL[i%10],e=m=>isEst(f,y,m);
      return {label:y,borderColor:c,backgroundColor:c,tension:.25,data:Array.from({length:12},(_,m)=>val(f,y,m)),
        pointBackgroundColor:Array.from({length:12},(_,m)=>e(m)?'transparent':c),pointRadius:Array.from({length:12},(_,m)=>e(m)?4:3),
        segment:{borderDash:s=>e(s.p0DataIndex)||e(s.p1DataIndex)?[5,4]:undefined}}})},
      options:{plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${isEst(f,+c.dataset.label,c.dataIndex)?'~':''}${fmt(c.raw)} kWh${isEst(f,+c.dataset.label,c.dataIndex)?' (estimated)':''}`}}}}});
  }else{
    const m=+mo,c=f==='gas'?'#f97316':'#3b82f6';
    draw('cm',{type:'bar',data:{labels:ys,datasets:[{label:MN[m]+' kWh',backgroundColor:ys.map(y=>isEst(f,y,m)?fade(c):c),borderColor:c,borderWidth:ys.map(y=>isEst(f,y,m)?1.5:0),data:ys.map(y=>val(f,y,m))}]},
      options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>`${isEst(f,+x.label,m)?'~':''}${fmt(x.raw)} kWh${isEst(f,+x.label,m)?' (estimated)':''}`}}}}});
  }
  let h='<table><thead><tr><th></th>'+ys.map(y=>`<th>${y}</th>`).join('')+`<th>${ya} vs ${yb}</th></tr></thead><tbody>`;
  for(let m=0;m<12;m++){
    const a=val(f,ya,m),b=val(f,yb,m);
    h+=`<tr><td>${MN[m]}</td>`+ys.map(y=>`<td>${fmtE(val(f,y,m),isEst(f,y,m))}</td>`).join('')+`<td>${pctHtml(pct(a,b),isEst(f,ya,m)||isEst(f,yb,m))}</td></tr>`;
  }
  const sa=span(f,ya,LM),sb=span(f,yb,LM);
  h+=`</tbody><tfoot><tr><td>Jan–${MN[LM]}</td>`+ys.map(y=>`<td>${fmtE(span(f,y,LM),anyEst(f,y,LM))}</td>`).join('')+`<td>${pctHtml(pct(sa,sb),anyEst(f,ya,LM)||anyEst(f,yb,LM))}</td></tr></tfoot></table>`;
  const shownEst=ys.some(y=>anyEst(f,y,11));
  $('tbl').className='scroll';
  $('tbl').innerHTML=h+`<p class="mut">Monthly figures in kWh. The latest month may be incomplete.`+(shownEst?' ~ = estimated (dashed lines and lighter bars in the chart); see About the data.':'')+(f==='gas'&&D.gas_unit==='m3'?` Gas converted from m³ at about ${GASF} kWh/m³.`:'')+'</p>';
}

function detailWeeks(){
  $('dtitle').textContent='Usage by week';
  const f=$('fuel').value,wo=$('month').value,ya=+$('ya').value,yb=+$('yb').value;
  const ys=years.filter(y=>WI[f][y]&&Object.keys(WI[f][y]).length);
  const W=Array.from({length:53},(_,i)=>i+1);
  if(wo==='all'){
    draw('cm',{type:'line',data:{labels:W.map(w=>'Wk '+w),datasets:ys.map((y,i)=>{const c=COL[i%10];
      return {label:y,borderColor:c,backgroundColor:c,tension:.25,pointRadius:1.5,borderWidth:2,data:W.map(w=>wval(f,y,w))}})},
      options:{interaction:{mode:'index',intersect:false},
        scales:{x:{ticks:{maxTicksLimit:14}}},
        plugins:{tooltip:{callbacks:{title:t=>`${t[0].label} (w/c ${wkLabel(+t[0].dataset.label,t[0].dataIndex+1)})`,label:c=>`${c.dataset.label}: ${fmt(c.raw)} kWh`}}}}});
  }else{
    const w=+wo,c=f==='gas'?'#f97316':'#3b82f6';
    draw('cm',{type:'bar',data:{labels:ys,datasets:[{label:'Week '+w,backgroundColor:c,data:ys.map(y=>wval(f,y,w))}]},
      options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>`w/c ${wkLabel(+x.label,w)}: ${fmt(x.raw)} kWh`}}}}});
  }
  // table: every week that has data in any year
  const rowsW=W.filter(w=>ys.some(y=>wval(f,y,w)!=null));
  let h='<table><thead><tr><th>Week</th>'+ys.map(y=>`<th>${y}</th>`).join('')+`<th>${ya} vs ${yb}</th></tr></thead><tbody>`;
  for(const w of rowsW){
    h+=`<tr><td>${w} <span class="mut">${wkLabel(LWY,w)}</span></td>`+ys.map(y=>`<td>${fmt(wval(f,y,w))}</td>`).join('')
      +`<td>${pctHtml(pct(wval(f,ya,w),wval(f,yb,w)))}</td></tr>`;
  }
  // like-for-like footer: weeks 1..latest complete week, only where both years have that week
  let sa=0,sb=0,n=0;
  for(let w=1;w<=LWW;w++){const a=wval(f,ya,w),b=wval(f,yb,w);if(a!=null&&b!=null){sa+=a;sb+=b;n++}}
  const tot=y=>{let s=0;for(let w=1;w<=LWW;w++){const v=wval(f,y,w);if(v==null)return null;s+=v}return s};
  h+=`</tbody><tfoot><tr><td>Wk 1–${LWW}</td>`+ys.map(y=>`<td>${fmt(tot(y))}</td>`).join('')
    +`<td title="Compares the ${n} weeks both years have">${pctHtml(n?pct(sa,sb):null)}</td></tr></tfoot></table>`;
  $('tbl').className='scroll tall';
  $('tbl').innerHTML=h+`<p class="mut">Weekly figures in kWh, Monday to Sunday, numbered by ISO week (dates shown are for ${LWY}). Weeks with missing readings are left blank rather than estimated, and the latest week may be incomplete. The ${ya} vs ${yb} total compares only the ${n} weeks both years have.`
    +(f==='gas'&&D.gas_unit==='m3'?` Gas converted from m³ at about ${GASF} kWh/m³.`:'')+'</p>';
}

// installable app: offline cache + "Install app" button
let installEvt;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('install').hidden=false});
$('install').onclick=async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('install').hidden=true};
addEventListener('appinstalled',()=>{$('install').hidden=true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></main></body></html>
