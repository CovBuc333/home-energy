name: Update energy data and deploy site

on:
  schedule:
    - cron: "17 6,19 * * *"   # twice daily, 06:17 and 19:17 UTC (evening run catches late readings)
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths:
      - site/**
      - fetch_octopus.py
      - .github/workflows/update.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Octopus data and merge into site/data.json
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_ACCOUNT: ${{ secrets.OCTOPUS_ACCOUNT }}
          GAS_UNIT: m3   # change to kwh if your gas meter already reports kWh
        run: python fetch_octopus.py

      - name: Add daily outdoor temperature (Open-Meteo, for weather-adjusted gas)
        continue-on-error: true
        run: python fetch_weather.py

      - name: Commit data (keeps full history in git)
        run: |
          git config user.name "energy-bot"
          git config user.email "energy-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update energy data"
          # main may have moved during the run (e.g. a code push) - rebase and retry
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy runs as its own job so the uploaded site artifact has finished
  # registering first (deploying in the same job sometimes reports
  # "No artifacts named github-pages were found"). Retries once if it still fails.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
